[pytest]
# Mode d'import robuste : pas besoin d'__init__.py dans les dossiers de tests, et
# tolère des fichiers de test de même nom dans des sous-dossiers différents
# (indispensable après le mirroring tests/ ≤10 calqué sur bourbaki/).
addopts = --import-mode=importlib
markers =
    slow: test lent (cardinaux profonds, N_existe)
